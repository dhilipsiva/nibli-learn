[package]
name = "nibli-learn-labs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
nibli-kr = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
nibli-semantics = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
nibli-auth = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
nibli-engine = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
nibli-session = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
nibli-reason = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836", features = ["serde"] }
nibli-types = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836", features = ["serde"] }
nibli-import = { git = "https://github.com/dhilipsiva/nibli", rev = "0440db4233f8a8cffbf81be9654a5e54c1f9c836" }
serde_json = "1"
