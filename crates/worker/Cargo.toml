[package]
name = "nibli-learn-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
nibli-learn-model.workspace = true
nibli-session.workspace = true
nibli-types.workspace = true
nibli-protocol.workspace = true
nibli-render.workspace = true
nibli-formalize.workspace = true
nibli-kr.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
